name: FlyCam Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'custom/**'
    paths:
      - 'custom/**'
      - 'dispatcher/**'
      - 'analytics/**'
      - 'docs/certification/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/flycam-windows.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: cmd

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Visual Studio and NSIS dependencies
        uses: ./.github/actions/install-dependencies
        with:
          gstreamer: 'false'
          msvc: 'true'
          nsis: 'true'

      - name: Install Qt 6
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release
          cache-variant: flycam

      - name: Install dispatcher encryption dependency
        shell: pwsh
        run: uv pip install --python python -r dispatcher/requirements.txt

      - name: Test dispatcher, encryption and analytics metadata
        shell: pwsh
        run: python -m unittest -v dispatcher.test_crypto dispatcher.test_server analytics.test_video_analytics

      - name: Package dispatcher server
        shell: pwsh
        run: |
          $distDir = Join-Path $env:RUNNER_TEMP "flycam-dispatcher-dist"
          $workDir = Join-Path $env:RUNNER_TEMP "flycam-dispatcher-build"
          $specDir = Join-Path $env:RUNNER_TEMP "flycam-dispatcher-spec"
          $sourceDir = (Resolve-Path "dispatcher").Path
          $webDir = (Resolve-Path "dispatcher/web").Path
          uv pip install --python python pyinstaller==6.16.0 -r dispatcher/requirements.txt
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --noconsole `
            --name FlyCam-Dispatcher-Server `
            --paths $sourceDir `
            --add-data "$webDir;web" `
            --distpath $distDir `
            --workpath $workDir `
            --specpath $specDir `
            dispatcher/server.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $dispatcherExe = (Resolve-Path (Join-Path $distDir "FlyCam-Dispatcher-Server.exe")).Path.Replace('\', '/')
          "FLYCAM_DISPATCHER_EXE=$dispatcherExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package video analytics
        shell: pwsh
        run: |
          uv pip install --python python pyinstaller==6.16.0 -r analytics/requirements.txt
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $distDir = Join-Path $env:RUNNER_TEMP "flycam-analytics-dist"
          $workDir = Join-Path $env:RUNNER_TEMP "flycam-analytics-build"
          $specDir = Join-Path $env:RUNNER_TEMP "flycam-analytics-spec"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name FlyCam-Video-Analytics `
            --distpath $distDir `
            --workpath $workDir `
            --specpath $specDir `
            analytics/video_analytics.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $analyticsExe = (Resolve-Path (Join-Path $distDir "FlyCam-Video-Analytics.exe")).Path.Replace('\', '/')
          "FLYCAM_ANALYTICS_EXE=$analyticsExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure custom build
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/flycam-build
          build-type: Release
          extra-args: >-
            -DQGC_BUILD_TESTING=OFF
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF
            -DFLYCAM_DISPATCHER_SERVER_EXECUTABLE=${{ env.FLYCAM_DISPATCHER_EXE }}
            -DFLYCAM_VIDEO_ANALYTICS_EXECUTABLE=${{ env.FLYCAM_ANALYTICS_EXE }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/flycam-build
          build-type: Release

      - name: Verify executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/flycam-build/Release/FlyCam-AeroScope-AgroScope-Control-Center.exe
          type: exe
          build-dir: ${{ runner.temp }}/flycam-build

      - name: Create installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/flycam-build
          build-type: Release

      - name: Install and verify package
        shell: pwsh
        run: |
          $buildDir = "${{ runner.temp }}\flycam-build"
          $installer = Get-ChildItem -Path $buildDir -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "FlyCam installer was not generated"
          }

          $installDir = "${{ runner.temp }}\flycam-install-test"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow
          $installedBinary = Join-Path $installDir "bin\FlyCam-AeroScope-AgroScope-Control-Center.exe"
          if (-not (Test-Path $installedBinary)) {
            throw "Installed FlyCam executable was not found"
          }

          $installedDispatcher = Join-Path $installDir "bin\FlyCam-Dispatcher-Server.exe"
          if (-not (Test-Path $installedDispatcher)) {
            throw "Installed FlyCam dispatcher server was not found"
          }

          $installedAnalytics = Join-Path $installDir "bin\FlyCam-Video-Analytics.exe"
          if (-not (Test-Path $installedAnalytics)) {
            throw "Installed FlyCam video analytics executable was not found"
          }
          & $installedAnalytics --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "FlyCam video analytics self-test failed"
          }

          $dispatcherTestDir = Join-Path "${{ runner.temp }}" "flycam-dispatcher-test"
          New-Item -ItemType Directory -Force -Path $dispatcherTestDir | Out-Null
          $dispatcherDatabase = Join-Path $dispatcherTestDir "dispatcher.sqlite3"
          $dispatcherProcess = Start-Process -FilePath $installedDispatcher `
            -ArgumentList "--host", "127.0.0.1", "--port", "18088", "--db", $dispatcherDatabase `
            -WindowStyle Hidden -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($dispatcherProcess.HasExited) {
                break
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18088/health" -TimeoutSec 1
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $health -or $health.status -ne "ok") {
              $dispatcherLog = Join-Path $dispatcherTestDir "flycam-dispatcher.log"
              if (Test-Path $dispatcherLog) {
                Write-Host "FlyCam dispatcher log:"
                Get-Content $dispatcherLog
              }
              $exitDetail = if ($dispatcherProcess.HasExited) {
                " process exited with code $($dispatcherProcess.ExitCode)"
              } else {
                " process did not become ready before the timeout"
              }
              throw "FlyCam dispatcher health check failed;$exitDetail"
            }

            $dashboard = Invoke-WebRequest -Uri "http://127.0.0.1:18088/" -TimeoutSec 2
            if ($dashboard.StatusCode -ne 200 -or $dashboard.Content -notmatch "FlyCam") {
              throw "FlyCam dispatcher dashboard verification failed"
            }

            $telemetryOne = @{
              vehicleId = 1
              flightMode = "Hold"
              armed = $false
              flying = $false
              latitude = 43.2389
              longitude = 76.8897
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post `
              -Uri "http://127.0.0.1:18088/api/v1/telemetry" `
              -ContentType "application/json" -Body $telemetryOne | Out-Null
            $telemetryTwo = @{
              vehicleId = 2
              flightMode = "Mission"
              armed = $true
              flying = $true
              latitude = 43.2390
              longitude = 76.8898
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post `
              -Uri "http://127.0.0.1:18088/api/v1/telemetry" `
              -ContentType "application/json" -Body $telemetryTwo | Out-Null
            $vehicles = Invoke-RestMethod -Uri "http://127.0.0.1:18088/api/v1/vehicles"
            if (@($vehicles.vehicles).Count -ne 2) {
              throw "FlyCam dispatcher multi-vehicle telemetry round-trip failed"
            }

            $detection = @{
              vehicleId = 2
              objectClass = "person"
              confidence = 0.91
              source = "ci-camera"
              bbox = @{ x = 0.1; y = 0.2; width = 0.3; height = 0.4 }
            } | ConvertTo-Json -Depth 3 -Compress
            Invoke-RestMethod -Method Post `
              -Uri "http://127.0.0.1:18088/api/v1/detections" `
              -ContentType "application/json" -Body $detection | Out-Null
            $detections = Invoke-RestMethod -Uri "http://127.0.0.1:18088/api/v1/detections"
            if (@($detections.detections).Count -ne 1 -or $detections.detections[0].objectClass -ne "person") {
              throw "FlyCam dispatcher detection round-trip failed"
            }
          } finally {
            if ($dispatcherProcess -and -not $dispatcherProcess.HasExited) {
              Stop-Process -Id $dispatcherProcess.Id -Force
            }
          }

          $artifactDir = "${{ runner.temp }}\flycam-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item $installer.FullName (Join-Path $artifactDir "FlyCam-AeroScope-AgroScope-Control-Center-Installer-x64.exe")
          Copy-Item $installedBinary (Join-Path $artifactDir "FlyCam-AeroScope-AgroScope-Control-Center.exe")
          Copy-Item $installedDispatcher (Join-Path $artifactDir "FlyCam-Dispatcher-Server.exe")
          Copy-Item $installedAnalytics (Join-Path $artifactDir "FlyCam-Video-Analytics.exe")
          Copy-Item "analytics\README_RU.md" (Join-Path $artifactDir "FlyCam-Video-Analytics-README_RU.md")

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: FlyCam-AeroScope-AgroScope-Control-Center-Windows-x64
          path: ${{ runner.temp }}/flycam-artifact/*
          if-no-files-found: error
          retention-days: 30
