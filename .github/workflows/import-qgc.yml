name: Import QGroundControl v5.1.3 and FlyCam custom layer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-qgc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import source snapshot and apply FlyCam changes
        shell: bash
        run: |
          set -euo pipefail
          cp import/flycam-v5.1.3.patch /tmp/flycam-v5.1.3.patch
          cp .github/workflows/import-qgc.yml /tmp/import-qgc.yml
          git remote add upstream https://github.com/mavlink/qgroundcontrol.git
          git fetch upstream refs/tags/v5.1.3:refs/tags/v5.1.3
          git checkout --orphan flycam-import v5.1.3
          git config user.name "FlyCam Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git apply --index /tmp/flycam-v5.1.3.patch
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/import-qgc.yml .github/workflows/import-qgc.yml
          git add -A
          git commit -m "feat: import QGroundControl v5.1.3 with FlyCam Control Center"
          git branch -M main
          git push --force origin HEAD:main
