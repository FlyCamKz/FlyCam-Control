services:
  dispatcher:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      FLYCAM_API_KEY: "${FLYCAM_API_KEY:-}"
      FLYCAM_ADMIN_KEY: "${FLYCAM_ADMIN_KEY:-}"
      FLYCAM_INGEST_KEY: "${FLYCAM_INGEST_KEY:-}"
      FLYCAM_VIEWER_KEY: "${FLYCAM_VIEWER_KEY:-}"
      FLYCAM_OPERATOR_KEY: "${FLYCAM_OPERATOR_KEY:-}"
      FLYCAM_RETENTION_DAYS: "${FLYCAM_RETENTION_DAYS:-30}"
      FLYCAM_TLS_CERT: "${FLYCAM_TLS_CERT:-}"
      FLYCAM_TLS_KEY: "${FLYCAM_TLS_KEY:-}"
      FLYCAM_TLS_CA: "${FLYCAM_TLS_CA:-}"
      FLYCAM_REQUIRE_CLIENT_CERT: "${FLYCAM_REQUIRE_CLIENT_CERT:-0}"
    volumes:
      - flycam_dispatcher_data:/data

volumes:
  flycam_dispatcher_data:
